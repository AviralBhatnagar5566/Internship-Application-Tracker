<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration page</title>
    <link rel="stylesheet" href="CSS/auth.css">
</head>
<body>
    <div class="container">
        <h3>💼Internship Tracker</h3>
        <h1>Create Your Account</h1>
        <p>Fill in the details below to set up your new account</p>
        <form id="RegistrationLoginForm">
            <label for="username" style="font-weight: bold;">UserName</label>
            <input type="text" id="username" placeholder="Enter UserName">
             <span class="error" id="usernameError"></span>

            <label for="email" style="font-weight: bold;">E-mail</label>
            <input type="text" id="email" placeholder="Enter Email">
             <span class="error" id="emailError"></span>

            <label for="password" style="font-weight: bold;">password</label>
            <input type="password" id="password" placeholder="Enter Password">
             <span class="error" id="PasswordError"></span>

            <label for="DOB" style="font-weight: bold;">Date Of Birth</label>
            <input type="date" id="DOB">
             <span class="error" id="DOBerror"></span>

            <button type="submit" id="createaccount">Create Account</button>
            <p id="successMsg" style="color: green;"></p>

        </form>
        <h3 id="or">──────────── or ────────────</h3>
        <h3>Already have an account?  <a href="Login.html">Login</a></h3>
        


    </div>
</body>
<script src="JS/register.script.js"></script>
</html>
